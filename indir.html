<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FizyoPark Uygulamasını İndir</title>
  <meta name="description" content="FizyoPark mobil uygulamasını App Store veya Google Play'den indirin." />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <meta property="og:title" content="FizyoPark Uygulamasını İndir" />
  <meta property="og:description" content="Seanslarını takip etmek için FizyoPark uygulamasını indir." />
  <meta property="og:image" content="./icons/icon-512.png" />
  <style>
    :root{
      --bg:#0b1020;
      --panel:#121a33;
      --border:rgba(255,255,255,.10);
      --text:#e8ecff;
      --muted:rgba(232,236,255,.66);
      --accent:#7c5cff;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font);
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(124,92,255,.22), transparent 70%),
        var(--bg);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .card{
      width:100%;
      max-width:380px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:20px;
      padding:32px 24px 26px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .logo{
      width:84px;height:84px;
      margin:0 auto 18px;
      border-radius:20px;
      background:#fff center/72% no-repeat url("./icons/fizyopark-logo-web.png");
      box-shadow:0 8px 24px rgba(0,0,0,.35);
    }
    h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
    .sub{font-size:14px;color:var(--muted);margin:0 0 24px;line-height:1.5}
    .btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;min-height:54px;
      margin-bottom:12px;
      border-radius:14px;
      background:#fff;color:#0b1020;
      font-size:16px;font-weight:600;
      text-decoration:none;
      border:0;
      transition:transform .12s ease, opacity .12s ease;
    }
    .btn:active{transform:scale(.98);opacity:.9}
    .btn svg{width:22px;height:22px;flex:0 0 auto}
    .status{
      font-size:13px;color:var(--muted);
      min-height:18px;margin-top:14px;
    }
    .foot{
      margin-top:18px;padding-top:16px;
      border-top:1px solid var(--border);
      font-size:12px;color:var(--muted);
    }
    @media (prefers-reduced-motion:no-preference){
      .card{animation:rise .35s ease both}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" role="img" aria-label="FizyoPark"></div>
    <h1>FizyoPark Uygulaması</h1>
    <p class="sub">Seanslarını, paketlerini ve randevularını cebinden takip et.</p>

    <a class="btn" id="btn-ios" href="https://apps.apple.com/tr/app/id6786732983">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.6zM14.2 5.5c.6-.8 1.1-1.9 1-3-1 0-2.2.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.6 2.8-1.4z"/></svg>
      App Store'dan indir
    </a>

    <a class="btn" id="btn-android" href="https://play.google.com/store/apps/details?id=com.fizyopark.mobilern">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.2c-.3.3-.5.8-.5 1.4v16.8c0 .6.2 1.1.5 1.4l.1.1 9.4-9.4v-.2L3.6 2.2zM16.6 15.3l-3.1-3.1v-.2l3.1-3.1.1.1 3.7 2.1c1.1.6 1.1 1.6 0 2.2l-3.7 2.1-.1-.1zM15.7 16.2L12.5 13 3 22.5c.4.4 1 .4 1.7 0l11-6.3M15.7 7.8l-11-6.3c-.7-.4-1.3-.3-1.7.1l9.5 9.4 3.2-3.2z"/></svg>
      Google Play'den indir
    </a>

    <p class="status" id="status" aria-live="polite"></p>

    <p class="foot">FizyoPark · Ankara</p>
  </main>

  <script>
    (function () {
      var IOS_URL = "https://apps.apple.com/tr/app/id6786732983";
      var PLAY_URL = "https://play.google.com/store/apps/details?id=com.fizyopark.mobilern";

      var ua = navigator.userAgent || "";
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        // iPadOS 13+ masaüstü UA gönderiyor
        (/Macintosh/.test(ua) && typeof document.ontouchend !== "undefined");
      var isAndroid = /Android/.test(ua);

      var status = document.getElementById("status");
      var target = null;
      var label = "";

      if (isIOS) { target = IOS_URL; label = "App Store"; }
      else if (isAndroid) { target = PLAY_URL; label = "Google Play"; }

      if (!target) {
        status.textContent = "Telefonunuzun mağazasını seçin.";
        return;
      }

      status.textContent = label + " açılıyor…";
      // Sayfanın boyanması için kısa gecikme; yönlendirme engellenirse butonlar duruyor.
      setTimeout(function () {
        window.location.replace(target);
      }, 700);
    })();
  </script>
</body>
</html>
